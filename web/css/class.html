<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 클래스 선택자 : .클래스명 */

        .headings { color : lime;}

        .headings2 { 
            color:red;
            font-size : 50px;}

        h2.headings{
            color:blue;
        }  
    </style>
</head>
<body>
    <h1>클래스 선택자를 이용한 요소의 선택</h1>
    <h2 class="headings">이 부분에 스타일을 적용한다.</h2>
    <p>클래스 선택자를 이용하여 스타일을 적용할 HTML 요소를 한번에 선택할 수 있다.</p>
    <h3 class="headings">이 부분에도 같은 스타일을 적용한다.</h3>
    <h3 class="headings headings2">이 부분에는 다른 스타일과 추가스타일을 적용한다.</h3>
</body>
</html>
